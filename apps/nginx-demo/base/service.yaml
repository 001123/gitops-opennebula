apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: demo-nginx
  labels:
    app.kubernetes.io/name: nginx-demo
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30088
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nginx-demo
