apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-demo-content
  namespace: demo-nginx
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="vi">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>GitOps OpenNebula - Nginx Demo</title>
      <style>
        :root {
          --bg: #0b0f19;
          --card: #151c2e;
          --primary: #38bdf8;
          --accent: #818cf8;
          --success: #34d399;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: radial-gradient(circle at top, #1e293b, var(--bg));
          color: var(--text);
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }
        .container {
          max-width: 720px;
          width: 100%;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 40px;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 6px 14px;
          background: rgba(56, 189, 248, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.3);
          border-radius: 9999px;
          color: var(--primary);
          font-size: 0.875rem;
          font-weight: 600;
          margin-bottom: 20px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.9); } }
        h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 12px; background: linear-gradient(135deg, #fff, var(--muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.sub { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin-bottom: 32px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .feature-card {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 18px;
        }
        .feature-card h3 { font-size: 0.95rem; color: var(--primary); margin-bottom: 6px; }
        .feature-card p { font-size: 0.85rem; color: var(--muted); line-height: 1.4; }
        .footer-info {
          display: flex;
          align-items: center;
          justify-content: space-between;
          border-top: 1px solid var(--border);
          padding-top: 20px;
          color: var(--muted);
          font-size: 0.85rem;
        }
      </style>
    </head>
    <body>
      <div class="container">
        <div class="badge"><div class="dot"></div> GitOps Live & Healthy</div>
        <h1>Kubernetes & OpenNebula Demo</h1>
        <p class="sub">Ứng dụng Nginx này được triển khai tự động qua GitOps pipeline sử dụng <strong>ArgoCD</strong> và quản lý bảo mật bởi <strong>SOPS + Age</strong>.</p>
        
        <div class="grid">
          <div class="feature-card">
            <h3>🚀 ArgoCD GitOps</h3>
            <p>Đồng bộ liên tục từ Git repository theo mô hình App of Apps chuẩn declarative.</p>
          </div>
          <div class="feature-card">
            <h3>🔐 SOPS + Age</h3>
            <p>Secrets được mã hóa an toàn trên Git và giải mã on-the-fly qua CMP Sidecar.</p>
          </div>
          <div class="feature-card">
            <h3>☁️ OpenNebula SNO</h3>
            <p>Hạ tầng Single Node OpenNebula tối ưu hóa tài nguyên cho môi trường Lab/Dev.</p>
          </div>
        </div>

        <div class="footer-info">
          <span>Namespace: <code>demo-nginx</code></span>
          <span>Managed by: <code>gitops-opennebula</code></span>
        </div>
      </div>
    </body>
    </html>
